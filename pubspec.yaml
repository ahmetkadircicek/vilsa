name: vilsa
description: ""
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  firebase_core: ^3.12.1
  board_datetime_picker: ^2.5.0
  http: ^1.3.0
  html: ^0.15.5
  firebase_storage: ^12.4.4
  firebase_database: ^11.3.4
  flutter_launcher_icons: ^0.14.3
  flutter_slidable: ^4.0.0
  uuid: ^4.5.1
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "asset/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "asset/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - .env
